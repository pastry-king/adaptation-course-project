[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-forecast-course"
version = "0.1.0"
description = "Reproducible one-month-ahead credit issuance forecasting experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "torch>=2.3,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
]

[project.scripts]
credit-forecast = "credit_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
