# Все границы включительно; предыдущие фактические месяцы доступны при прогнозе t.
data_path: data/processed/monthly_credit_history.csv
output_dir: reports/generated
artifact_dir: artifacts
train_end: '2023-09-01'
validation_end: '2025-09-01'
test_end: '2026-09-01'
scenarios:
  full: '2009-04-01'
  current_only: '2019-01-01'
windows:
  full: [6, 12, 24, 36]
  current_only: [6, 12, 24]
top_windows: 2
screen_hidden: 32
architectures:
  - {hidden: 16, layers: 1}
  - {hidden: 32, layers: 1}
  - {hidden: 64, layers: 1}
  - {hidden: 32, layers: 2}
dropout: 0.2  # Межслойный dropout действует только при layers > 1.
learning_rate: 0.001
batch_size: 16
max_epochs: 80
patience: 10
screen_seed: 42
final_seeds: [42, 123, 456]
